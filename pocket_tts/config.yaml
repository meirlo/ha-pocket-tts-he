name: Pocket TTS
version: "0.1.0"
slug: pocket_tts
description: Local English text-to-speech with Pocket TTS ONNX over Wyoming
arch:
  - amd64
  - aarch64
startup: application
boot: auto
stage: experimental
init: true
timeout: 300
ports:
  10200/tcp: 10200
ports_description:
  10200/tcp: Wyoming TTS (trusted local network only)
watchdog: tcp://[HOST]:10200
map:
  - type: share
    read_only: true
backup_exclude:
  - huggingface/*
options:
  voice: alba
  model_path: ""
  offline: false
  num_threads: 2
  max_text_length: 4000
  log_level: info
schema:
  voice: str
  model_path: str
  offline: bool
  num_threads: int(1,32)
  max_text_length: int(1,16000)
  log_level: list(debug|info|warning|error)
