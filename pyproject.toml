[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pocket_tts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: downloads and runs the real Pocket TTS model"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
files = ["pocket_tts/wyoming_pocket_tts"]
strict = true

[[tool.mypy.overrides]]
module = ["pocket_tts_onnx", "pocket_tts_onnx.*"]
ignore_missing_imports = true
